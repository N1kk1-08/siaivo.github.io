<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MyLampa</title>

    <meta name="description" content="Застосунок для перегляду каталогу фільмів і серіалів на телевізорах, приставках і смартфонах." />

    <meta property="og:title" content="MyLampa">
    <meta property="og:description" content="Застосунок для перегляду каталогу фільмів і серіалів на телевізорах, приставках і смартфонах.">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image" content="og.png">

    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
    <link rel="icon" type="image/svg+xml" sizes="any" href="img/mylampa-mark-v2.svg">
    <link rel="manifest" href="icons/site.webmanifest" crossorigin="use-credentials">
    <link rel="mask-icon" href="icons/safari-pinned-tab.svg" color="#5bbad5">
    <link rel="shortcut icon" type="image/svg+xml" href="img/mylampa-mark-v2.svg">
    <meta name="msapplication-TileColor" content="#1d1f20">
    <meta name="msapplication-config" content="icons/browserconfig.xml">
    <meta name="theme-color" content="#1d1f20">

    <meta name="referrer" content="never">
    
    <link rel="stylesheet" href="./vender/scrollbar/jquery.scrollbar.css">
    <link rel="stylesheet" href="./vender/keypad/style.css">

    <link rel="stylesheet" href="css/app.css?v=4.56">
</head>
<body style="background: #1d1f20;">
    <script>
        window.youtube_lazy_load = true
    </script>

    <div class="welcome"></div>

    <div id="app">

    </div>

    <div class="no-network hide">
        <div class="no-network__title">Ошибка</div>
        <div class="no-network__desc">Не удалось загрузить файл: <span class="no-network__file"></span></div>
    </div>
    
    <script src="./webos/webOSTV.js"></script>
    <script src="./vender/jquery/jquery.js"></script>
    <script src="./vender/notify/notify.js"></script>
    <script src="./vender/scrollbar/jquery.scrollbar.js"></script>
    <script src="./vender/navigator/navigator.js"></script>
    <script src="./vender/keypad/keypad.js"></script>

    <script>
        var lampa_url     = '';
        var cache_version = Math.floor((new Date()).getTime() / 9e5); // Новое значение каждые 15 минут
            
        function urlJoin(base, add) {
            if (base.charAt(base.length - 1) !== '/') {
                base += '/'
            }

            return base + add
        }

        function putScript(scripts, onload, onerror){
            var add = function(src){
                console.log('Loader', 'try-load-script', src)

                var trys = 0

                var sreateScript = function(){
                    var script = document.createElement('script')
                    var finished = false

                    script.type = 'text/javascript'

                    script.onload = script.onreadystatechange = function(e) {
                        if (finished || (script.readyState && script.readyState !== 'loaded' && script.readyState !== 'complete')) return
                        finished = true
                        console.log('Loader', 'Script loaded', e)

                        if (!!onload) onload()
                    };

                    script.onerror = function(){
                        if (finished) return
                        finished = true
                        trys++

                        console.log('Loader', 'error-load-script', src)

                        if(trys < 3){
                            sreateScript()
                        } else if (!!onerror) {
                            onerror()
                        } else{
                            $('.no-network').removeClass('hide')

                            $('.no-network__file').text(window.location.href + '/' + src)
                        }
                    }

                    script.src = src

                    document.getElementsByTagName('body')[0].appendChild(script)
                }

                sreateScript()
            }

            add(scripts)
        }

        function loadMyLampaCustomizations() {
            putScript('mylampa-splash.js?v=' + cache_version, function () {})
            putScript('mylampa-sync.js?v=account-8-' + cache_version, function () {})
        }

        function loadCurrentLampa() {
            putScript('app.min.js?v=episode-1-' + cache_version, function () {
                loadMyLampaCustomizations()
            })
        }

        // MYLAMPA_BOOTSTRAP_V1: a direct fork update must also initialize Lampac.
        // LampaCron used to append this dependency only when it updated the fork.
        function loadLampacInitialization(done) {
            var match = String(lampa_url || location.href).match(/^(https?:\/\/[^/]+)/i)
            if (!match) return done()
            var origin = match[1]
            var finished = false
            function ready() {
                if (finished) return
                finished = true
                done()
            }
            function findScript(path) {
                var scripts = document.getElementsByTagName('script')
                for (var i = 0; i < scripts.length; i++) {
                    if (String(scripts[i].src).split('?')[0] === origin + path) return scripts[i]
                }
            }
            function initialized() {
                var client = findScript('/mylampa-access/client.js')
                if (window.mylampaAccessInstalled || !client) return ready()
                // The optional admin loader adds an async script. Do not start
                // native transports before its account hooks have been bound.
                var timeout = setTimeout(ready, 12000)
                function settled() { clearTimeout(timeout); ready() }
                client.addEventListener('load', settled)
                client.addEventListener('error', settled)
            }
            if (findScript('/lampainit.js')) initialized()
            else putScript(origin + '/lampainit.js?v=' + cache_version, initialized, ready)
        }

        function loadLocalLampa(){
            if(lampa_url !== '') window.local_lampa = true

            loadCurrentLampa()
        }

        function startMyLampa() {
            if (typeof AndroidJS !== "undefined"
                && !!AndroidJS.getLampaURL
                && /^https?:\/\//i.test(AndroidJS.getLampaURL())
                && !/^https?:\/\//i.test(location.href)
            ) {
                lampa_url = urlJoin(AndroidJS.getLampaURL(),'')
            }

            loadLampacInitialization(function () {
                if (lampa_url !== '') {
                    putScript(
                        urlJoin(lampa_url, 'app.min.js?v=episode-1-' + cache_version),
                        function () {
                            var css = urlJoin(lampa_url, 'css/app.css?v=' + cache_version)

                            $('head').append('<link rel="stylesheet" href="' + css + '">')
                            loadMyLampaCustomizations()
                        },
                        function () {
                            putScript(
                                urlJoin(lampa_url, 'lampa-main/app.min.js?v=episode-1-' + cache_version),
                                function () {
                                    var css = urlJoin(lampa_url, 'lampa-main/css/app.css?v=' + cache_version)

                                    $('head').append('<link rel="stylesheet" href="' + css + '">')

                                    loadMyLampaCustomizations()

                                },
                                loadLocalLampa
                            )
                        }
                    )
                }
                else{
                    loadCurrentLampa()
                }
            })
        }
        // A normal Lampac update may already have appended /lampainit.js at
        // the end of this document. Let that script run before checking it.
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', startMyLampa)
        else startMyLampa()
    </script>
</body>
</html>
